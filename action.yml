name: 'Claude Auto Code Review'
description: 'Incremental pull request review by Claude Code, authenticated with a Claude subscription OAuth token. No GitHub App required.'
branding:
  icon: 'book-open'
  color: 'orange'

inputs:
  claude_code_oauth_token:
    description: 'Claude Code OAuth token generated with `claude setup-token` (store it as a secret)'
    required: true
  github_token:
    description: 'GitHub token used to read the PR and post comments. Defaults to the workflow GITHUB_TOKEN, so the Claude GitHub App is not needed.'
    required: false
    default: ${{ github.token }}
  model:
    description: 'Claude model name or alias (e.g., claude-sonnet-5, claude-opus-5-5, sonnet, opus)'
    required: false
    default: 'claude-sonnet-5'
  effort:
    description: 'Optional effort level (low, medium, high, xhigh, max). Leave empty to use the model default.'
    required: false
  max_turns:
    description: 'Maximum number of agentic turns Claude may take for one review'
    required: false
    default: '50'
  include_extensions:
    description: 'File extensions to include in the review (comma-separated, e.g., ".py,.js,.html")'
    required: false
  exclude_extensions:
    description: 'File extensions to exclude from the review (comma-separated)'
    required: false
  include_paths:
    description: 'Paths to include in the review (comma-separated)'
    required: false
  exclude_paths:
    description: 'Paths to exclude from review (comma-separated, e.g., "test/,docs/")'
    required: false
  review_rules_file:
    description: 'Path to a file with custom review rules added to the prompt. Read from the PR base branch.'
    required: false
  fail_action_if_review_failed:
    description: 'If set to true, the action fails when the review process fails'
    required: false
    default: 'false'
  allowed_bots:
    description: 'Comma-separated bot usernames whose PRs may be reviewed (e.g., "dependabot[bot]"), or "*" for all bots'
    required: false
  checkout:
    description: 'Check out the PR head (shallow) so Claude can read code for context. Set to false if the workflow already checks out the PR head.'
    required: false
    default: 'true'

outputs:
  skipped:
    description: 'true when there was nothing new to review'
    value: ${{ steps.prepare.outputs.skip }}
  reviewed_commit:
    description: 'Head commit recorded as reviewed (empty if the review did not complete)'
    value: ${{ steps.summary.outputs.reviewed_commit }}
  summary:
    description: 'Review summary posted to the PR'
    value: ${{ steps.summary.outputs.summary }}

runs:
  using: 'composite'
  steps:
    - name: Select files to review
      id: prepare
      uses: actions/github-script@v8
      env:
        INCLUDE_EXTENSIONS: ${{ inputs.include_extensions }}
        EXCLUDE_EXTENSIONS: ${{ inputs.exclude_extensions }}
        INCLUDE_PATHS: ${{ inputs.include_paths }}
        EXCLUDE_PATHS: ${{ inputs.exclude_paths }}
        REVIEW_RULES_FILE: ${{ inputs.review_rules_file }}
        FAIL_ACTION_IF_REVIEW_FAILED: ${{ inputs.fail_action_if_review_failed }}
        # GITHUB_ACTION_PATH points at github-script itself inside this step
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await require(process.env.ACTION_PATH + '/scripts/prepare.js')({ github, context, core });

    - name: Check out PR head
      if: steps.prepare.outputs.skip == 'false' && inputs.checkout == 'true'
      uses: actions/checkout@v6
      with:
        ref: ${{ steps.prepare.outputs.head_sha }}
        fetch-depth: 1
        persist-credentials: false

    - name: Review with Claude Code
      id: claude
      if: steps.prepare.outputs.skip == 'false'
      continue-on-error: true
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.claude_code_oauth_token }}
        github_token: ${{ inputs.github_token }}
        allowed_bots: ${{ inputs.allowed_bots }}
        prompt: ${{ steps.prepare.outputs.prompt }}
        claude_args: >-
          --model ${{ inputs.model }}
          --max-turns ${{ inputs.max_turns }}
          ${{ inputs.effort && format('--effort {0}', inputs.effort) || '' }}
          --allowedTools "Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment"
          --disallowedTools "Bash,Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch"
          --json-schema '{"type":"object","properties":{"summary":{"type":"string","description":"Brief review summary: overview of the changes, quality assessment, recurring patterns"}},"required":["summary"]}'

    - name: Post review summary
      id: summary
      if: steps.prepare.outputs.skip == 'false'
      uses: actions/github-script@v8
      env:
        HEAD_SHA: ${{ steps.prepare.outputs.head_sha }}
        REVIEW_OUTCOME: ${{ steps.claude.outcome }}
        REVIEW_CONCLUSION: ${{ steps.claude.outputs.conclusion }}
        STRUCTURED_OUTPUT: ${{ steps.claude.outputs.structured_output }}
        FAIL_ACTION_IF_REVIEW_FAILED: ${{ inputs.fail_action_if_review_failed }}
        ACTION_PATH: ${{ github.action_path }}
      with:
        github-token: ${{ inputs.github_token }}
        script: |
          await require(process.env.ACTION_PATH + '/scripts/post-summary.js')({ github, context, core });
